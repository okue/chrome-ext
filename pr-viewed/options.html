<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>PR Auto Viewed</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 480px; padding: 8px 12px; }
    label { display: block; margin: 8px 0; }
    textarea { width: 100%; height: 140px; font-family: ui-monospace, monospace; }
    small { color: #666; }
    #saved { color: #1a7f37; margin-left: 8px; }
  </style>
</head>
<body>
  <label><input type="checkbox" id="enabled" /> 有効にする</label>
  <label>
    <input type="checkbox" id="contentCheck" /> ファイル先頭を読んで判定する
    <small>（<code>@generated</code> / <code>DO NOT EDIT</code> など。diff に 1 行目が無いファイルは raw を取得）</small>
  </label>
  <label>
    追加の Auto-viewed パターン（difit の設定と同じ書式。1 行 1 パターン、<code>#</code> でコメント）
    <textarea id="patterns" placeholder="*.test.ts&#10;docs/**&#10;**/__snapshots__/**"></textarea>
    <small><code>/</code> を含まないパターンはファイル名に、含むパターンはリポジトリルートからのパスにマッチ。<code>*</code> / <code>?</code> / <code>**</code> が使えます。</small>
  </label>
  <button id="save">保存</button><span id="saved"></span>
  <script src="lib/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
